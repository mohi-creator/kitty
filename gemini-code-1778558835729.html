<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitty | AI-Powered Sustainable Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F5F5DC; }
        .serif { font-family: 'Playfair Display', serif; }
        .bg-sage { background-color: #87A96B; }
        .text-sage { color: #87A96B; }
        /* Smooth Fade-in for API results */
        .product-card { opacity: 0; transform: translateY(20px); transition: all 0.5s ease-out; }
        .product-card.visible { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="text-stone-800">

    <!-- NAVIGATION -->
    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-stone-200">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="text-3xl serif font-bold tracking-tighter">kitty<span class="text-sage">.</span></div>
            <div class="hidden md:flex space-x-8 font-medium text-sm uppercase tracking-widest">
                <a href="#" class="hover:text-sage transition">Shop</a>
                <a href="#" class="hover:text-sage transition">Best Sellers</a>
                <a href="#" class="hover:text-sage transition">Impact</a>
            </div>
            <div class="flex items-center space-x-5">
                <div class="relative hidden lg:block">
                    <input type="text" id="apiSearch" placeholder="Search eco-essentials..." 
                           class="bg-stone-100 border-none rounded-full py-2 px-4 text-sm w-64 focus:ring-1 focus:ring-sage">
                </div>
                <button onclick="toggleCart()" class="relative p-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
                    <span id="cartCount" class="absolute top-0 right-0 bg-sage text-white text-[10px] rounded-full h-4 w-4 flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <section class="relative h-[60vh] flex items-center overflow-hidden bg-stone-900">
        <img src="https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&q=80&w=2000" class="absolute inset-0 w-full h-full object-cover opacity-60">
        <div class="relative z-10 max-w-7xl mx-auto px-6 text-white">
            <h1 class="text-5xl md:text-7xl serif mb-4">Pure. Professional.</h1>
            <p class="text-lg max-w-lg mb-8 text-stone-200">Access our catalog of 1,000+ ethically curated products via real-time Amazon fulfillment.</p>
            <button onclick="document.getElementById('shop').scrollIntoView({behavior: 'smooth'})" class="bg-sage px-10 py-4 rounded-full font-bold uppercase tracking-tighter hover:scale-105 transition-transform">Browse Catalog</button>
        </div>
    </section>

    <!-- MAIN PRODUCT GRID -->
    <main id="shop" class="max-w-7xl mx-auto px-6 py-20">
        <div id="loader" class="text-center py-10 hidden">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-sage"></div>
            <p class="mt-4 text-stone-500 serif italic">Sourcing sustainable goods...</p>
        </div>
        
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-10">
            <!-- API Products will inject here -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-stone-100 py-12 px-6 border-t border-stone-200">
        <div class="max-w-7xl mx-auto text-center">
            <p class="serif text-xl mb-4">kitty.</p>
            <div class="flex justify-center space-x-6 text-xs uppercase tracking-widest text-stone-500">
                <a href="#">Privacy</a><a href="#">Terms</a><a href="#">Affiliate Disclosure</a>
            </div>
        </div>
    </footer>

    <!-- CART DRAWER -->
    <div id="cartOverlay" onclick="toggleCart()" class="fixed inset-0 bg-black/40 z-[60] hidden backdrop-blur-sm"></div>
    <div id="cartDrawer" class="fixed top-0 right-0 w-full md:w-[400px] h-full bg-white z-[70] translate-x-full transition-transform duration-300 p-8 flex flex-col">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-2xl serif">Your Collection</h2>
            <button onclick="toggleCart()" class="text-stone-400">✕</button>
        </div>
        <div id="cartItems" class="flex-grow space-y-6 overflow-y-auto">
            <p class="text-stone-400 italic text-center">Your cart is empty.</p>
        </div>
        <div class="pt-6 border-t mt-auto">
            <button class="w-full bg-stone-900 text-white py-4 rounded-full font-bold">Checkout</button>
        </div>
    </div>

    <script>
        // --- API CONFIGURATION ---
        // Note: For production, you call your own backend which hides your Amazon Secret Keys.
        const MOCK_API_DATA = [
            { id: 1, title: "Recycled Wood Desk Organizer", price: "$32.00", img: "https://images.unsplash.com/photo-1591129841117-3adfd313e34f?auto=format&fit=crop&q=80&w=400", tag: "Best Seller" },
            { id: 2, title: "Hemp Fiber Laptop Sleeve", price: "$45.00", img: "https://images.unsplash.com/photo-1544731612-de7f96afe55f?auto=format&fit=crop&q=80&w=400", tag: "Eco-Choice" },
            { id: 3, title: "Minimalist Stone Paper Notebook", price: "$18.50", img: "https://images.unsplash.com/photo-1531346878377-a5be20888e57?auto=format&fit=crop&q=80&w=400", tag: "New Arrival" },
            { id: 4, title: "Solar Powered Desk Lamp", price: "$120.00", img: "https://images.unsplash.com/photo-1534073828943-f801091bb18c?auto=format&fit=crop&q=80&w=400", tag: "Premium" }
        ];

        let cart = [];

        // --- RENDER PRODUCTS ---
        function displayProducts(products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map((p, index) => `
                <div class="product-card group" style="transition-delay: ${index * 100}ms">
                    <div class="relative aspect-[4/5] bg-stone-100 rounded-2xl overflow-hidden mb-4">
                        <img src="${p.img}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <button onclick="addToCart('${p.title}', '${p.price}', '${p.img}')" 
                                class="absolute bottom-4 left-4 right-4 bg-white/90 backdrop-blur py-3 rounded-xl font-bold text-xs uppercase opacity-0 group-hover:opacity-100 translate-y-2 group-hover:translate-y-0 transition-all shadow-xl">
                            Add to Cart
                        </button>
                        ${p.tag ? `<span class="absolute top-4 left-4 bg-sage text-white text-[10px] px-3 py-1 rounded-full uppercase tracking-tighter">${p.tag}</span>` : ''}
                    </div>
                    <h3 class="font-semibold text-stone-800">${p.title}</h3>
                    <p class="text-sage font-bold mt-1">${p.price}</p>
                </div>
            `).join('');

            // Trigger animation
            setTimeout(() => {
                document.querySelectorAll('.product-card').forEach(card => card.classList.add('visible'));
            }, 100);
        }

        // --- CART LOGIC ---
        function addToCart(name, price, img) {
            cart.push({ name, price, img });
            updateCartUI();
            if(document.getElementById('cartDrawer').classList.contains('translate-x-full')) {
                toggleCart();
            }
        }

        function updateCartUI() {
            const cartContainer = document.getElementById('cartItems');
            document.getElementById('cartCount').innerText = cart.length;
            
            if(cart.length === 0) {
                cartContainer.innerHTML = `<p class="text-stone-400 italic text-center">Your cart is empty.</p>`;
                return;
            }

            cartContainer.innerHTML = cart.map(item => `
                <div class="flex items-center space-x-4 border-b border-stone-100 pb-4">
                    <img src="${item.img}" class="w-16 h-16 object-cover rounded-lg">
                    <div>
                        <p class="font-bold text-sm">${item.name}</p>
                        <p class="text-sage text-sm">${item.price}</p>
                    </div>
                </div>
            `).join('');
        }

        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('translate-x-full');
            document.getElementById('cartOverlay').classList.toggle('hidden');
        }

        // Initialize with Mock API Data
        window.onload = () => displayProducts(MOCK_API_DATA);

        // Search Listener (Filter Logic)
        document.getElementById('apiSearch').addEventListener('keyup', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = MOCK_API_DATA.filter(p => p.title.toLowerCase().includes(term));
            displayProducts(filtered);
        });
    </script>
</body>
</html>
